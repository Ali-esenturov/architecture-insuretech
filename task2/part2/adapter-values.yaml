prometheus:
  url: http://prometheus-kube-prometheus-prometheus.default.svc
  port: 9090

rules:
  custom:
  - seriesQuery: 'http_request_duration_seconds_count{namespace!="",pod!=""}'
    resources:
      overrides:
        namespace:
          resource: namespace
        pod:
          resource: pod
    name:
      matches: http_request_duration_seconds_count
      as: http_requests_per_second
    metricsQuery: |
      sum(rate(http_request_duration_seconds_count{<<.LabelMatchers>>}[1m])) by (pod)